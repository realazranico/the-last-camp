<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>The Last Camp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Pixelify+Sans:wght@500;700&display=swap">
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #rotate {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 10;
            background: #000;
            color: #e8dcb0;
            font: bold 6vw sans-serif;
            text-align: center;
            align-items: center;
            justify-content: center;
        }

        #rotate {
            display: none !important;
        }

        #wrap {
            position: relative;
        }

        canvas {
            image-rendering: pixelated;
            display: block;
        }

        #ov {
            position: absolute;
            left: 0;
            top: 0;
            pointer-events: none;
            image-rendering: auto;
        }
        .fld{position:absolute;display:none;z-index:5;box-sizing:border-box;background:#100808;color:#fff;border:1px solid #a05030;text-align:center;outline:none;font-family:"Courier New",Courier,monospace;font-weight:700;user-select:text;-webkit-user-select:text;padding:0;border-radius:0}
        .fld:focus{border-color:#ffb060;box-shadow:0 0 8px rgba(255,150,60,.6)}
    </style>
</head>
<body>
    <div id="rotate">Rotate your phone<br>to play (landscape)</div>
    <div id="wrap">
        <canvas id="c" width="320" height="180"></canvas>
        <canvas id="ov"></canvas>
        <input id="fa" class="fld" type="text" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        <input id="fb" class="fld" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
    </div>
    <script>
        const W = 320;
        const H = 180;
        const T = 16;
        const MW = 64;
        const MH = 48;
        const CX = MW * T / 2;
        const CY = MH * T / 2;
        const RXp = CX - 34;
        const RYp = CY + 2;
        const c = document.getElementById('c');
        const g = c.getContext('2d');
        const dk = document.createElement('canvas');
        dk.width = W;
        dk.height = H;
        const d = dk.getContext('2d');
        const NAMES = ['RICO', 'DRACO', 'PERCIVAL', 'ZACHARY'];
        const SH = ['#d9534f', '#3b9ae1', '#f0ad4e', '#9b59b6'];
        const MHP = [4, 12, 6, 4];
        const MSP = [40, 22, 34, 28];
        const ld = n => {
            const i = new Image();
            i.onerror = () => {
                i.onerror = null;
                if (ART[n]) i.src = ART[n];
            };
            i.src = 'assets/' + n + '.png';
            return i;
        };
        const ok = i => i.complete && i.naturalWidth > 0;
        const spr = NAMES.map(ld);
        const vspr = ['MANANANGGAL', 'KAPRE', 'TIKBALANG', 'MULTO'].map(ld);
        const LORE = [
            '1994|Students camp deep in the cursed Sierra Madre.',
            'Night fell too early.|The forest swallowed all the light.',
            'Their vehicles suddenly died.|There was no way out of the wilderness.',
            'One by one, friends vanished|into the dark. No scream. No warning.',
            'Manananggal. Kapre. Tikbalang. Multo.|They are hunting you now.',
            'Survive until sunrise...|or repair the emergency military radio.'
        ];
        const TIPS = [
            'Keep the fire burning. Monsters fear it.',
            'Wood builds shelters. Batteries repair the radio.',
            'Your flashlight is always in your bag.',
            'Slash with SPACE. Dash with SHIFT. Build with B.'
        ];
        const MSND = ['screech', 'rumble', 'neigh', 'whisper'];
        const SHEL_COST = 6;
        const SHEL_MAX = 12;
        let stepT = 0;
        let beastPg = 0, beastGo = null, beastPre = false, srvVal = '', srvAsk = false, joinCode = '', netTry = 0, swipeX = null, lastCh = -1, chv = 0, ldt = .016, fa = null, fb = null, mmC = null;
        const BEAST = [
            { n: 'MANANANGGAL', a: 'The Winged Torso', i: ['Splits at the waist and flies at night.', 'Glides over trees and walls.', 'Wobbles in the air: time your slash.'], tip: 'Stay by the fire. It will not cross it.' },
            { n: 'KAPRE', a: 'The Tree Giant', i: ['A huge smoker that waits in the trees.', 'Very slow, but very tough.', 'Hits for 2 hearts. Do not trade blows.'], tip: 'Kite it around trees, then slash.' },
            { n: 'TIKBALANG', a: 'The Horse Demon', i: ['Half horse, half man. Tricks travelers.', 'Charges in sudden bursts of speed.', 'Hits for 2 hearts.'], tip: 'DASH sideways when it charges.' },
            { n: 'MULTO', a: 'The Wandering Ghost', i: ['A pale spirit that floats in and out.', 'Passes straight through trees.', 'Fades in and out of sight.'], tip: 'Shelters and fire push it back.' }
        ];
        let mobSndT = 0;
        let shel = [];
        let st = 'title';
        let stT = 0;
        let gt = 0;
        let mode = 0;
        let ch = 0;
        let btns = [];
        let keys = {};
        let joy = null;
        let panel = 0;
        let musicVol = .6;
        let sfxVol = 1;
        let playerName = '';
        let instrPage = 0;
        let instrReturn = 'mode';
        let nameReturn = 'lore';
        let nameMsg = '';
        let endTitle = '';
        let died = false;
        let sfxGain = null;
        let musicGain = null;
        let musicTimer = null;
        let musicPad = [];
        let musicStep = 0;
        let touchOn = typeof matchMedia == 'function' && matchMedia('(pointer: coarse)').matches;
        let fullTried = false;
        const lit = {};
        let toast = '';
        let toastT = 0;
        let savedT = 0;
        let msg = '';
        let win = false;
        let map;
        let res;
        let mobs;
        let pl;
        let me;
        let wood;
        let scrap;
        let radio;
        let fire;
        let tl;
        let spT;
        let saveT;
        let nid = 1;
        let myId = 0;
        let hostF = false;
        let ws = null;
        let joined = 0;
        let code = "";
        let netMsg = "";
        let netT = 0;
        let nP = 2;
        let flash = true;
        let ac;
        const cleanName = s => String(s || '').replace(/[^A-Za-z0-9 ]/g, '').trim().slice(0, 12).trim();
        const shownName = () => cleanName(playerName) || 'PLAYER';
        const encName = n => n ? n.replace(/ /g, '_') : '-';
        const decName = n => n == '-' ? '' : n.replace(/_/g, ' ');
        const unit = (v, d) => v === null || v === undefined || isNaN(+v) ? d : Math.max(0, Math.min(1, +v));

        function loadPrefs() {
            try {
                const p = JSON.parse(localStorage.getItem('lcprefs'));
                if (p) {
                    playerName = cleanName(p.name);
                    musicVol = unit(p.music, .6);
                    sfxVol = unit(p.sfx, 1);
                }
            } catch (e) {}
        }

        function savePrefs() {
            try {
                localStorage.setItem('lcprefs', JSON.stringify({ name: cleanName(playerName), music: musicVol, sfx: sfxVol }));
            } catch (e) {}
        }

        loadPrefs();
        try { srvVal = localStorage.getItem('lcserver2') || ''; } catch (e) {}
        srvAsk = !location.protocol.startsWith('http');

        function audioCtx() {
            ac = ac || new(window.AudioContext || window.webkitAudioContext)();
            if (ac.state == 'suspended') ac.resume();
            return ac;
        }

        function sfxBus() {
            if (!sfxGain || sfxGain.context !== ac) {
                sfxGain = ac.createGain();
                sfxGain.gain.value = sfxVol;
                sfxGain.connect(ac.destination);
            }
            return sfxGain;
        }

        const MNOTES = [220.00, 261.63, 329.63, 293.66, 246.94, 261.63, 196.00, 233.08];

        function musicNote() {
            const f = MNOTES[musicStep++ % 8];
            const t = ac.currentTime;
            [[1, .5], [2.005, .15]].forEach(([m, v]) => {
                const o = ac.createOscillator();
                const gn = ac.createGain();
                o.type = 'sine';
                o.frequency.value = f * m;
                gn.gain.setValueAtTime(0, t);
                gn.gain.linearRampToValueAtTime(v, t + .05);
                gn.gain.exponentialRampToValueAtTime(.001, t + 2);
                o.connect(gn).connect(musicGain);
                o.start(t);
                o.stop(t + 2.1);
            });
        }

        function startMusic() {
            if (musicVol <= 0) return;
            try {
                audioCtx();
                if (musicTimer) return;
                if (!musicGain || musicGain.context !== ac) {
                    musicGain = ac.createGain();
                    musicGain.connect(ac.destination);
                }
                musicGain.gain.value = musicVol * .6;
                musicPad = [[55, .35], [82.5, .2]].map(([f, v]) => {
                    const o = ac.createOscillator();
                    const gn = ac.createGain();
                    o.type = 'sine';
                    o.frequency.value = f;
                    gn.gain.value = v;
                    o.connect(gn).connect(musicGain);
                    o.start();
                    return o;
                });
                musicNote();
                musicTimer = setInterval(musicNote, 2000);
            } catch (e) {}
        }

        function stopMusic() {
            clearInterval(musicTimer);
            musicTimer = null;
            musicPad.forEach(o => {
                try {
                    o.stop();
                } catch (e) {}
            });
            musicPad = [];
        }

        function setMusicVol(v) {
            musicVol = Math.max(0, Math.min(1, Math.round(v * 10) / 10));
            if (musicVol <= 0) stopMusic();
            else if (musicGain && musicTimer) musicGain.gain.value = musicVol * .6;
            else startMusic();
            savePrefs();
        }

        function setSfxVol(v) {
            sfxVol = Math.max(0, Math.min(1, Math.round(v * 10) / 10));
            if (sfxGain) sfxGain.gain.value = sfxVol;
            savePrefs();
            snd(700, .1, 'sine', .2, 950);
        }

        function goFull() {
            const e = document.documentElement;
            if (!document.fullscreenElement && e.requestFullscreen) {
                e.requestFullscreen().then(() => {
                    try {
                        screen.orientation.lock('landscape').catch(() => {});
                    } catch (x) {}
                }).catch(() => {});
            }
        }

        function snd(f, du, ty = 'square', v = .15, f2 = f) {
            if (sfxVol <= 0) return;
            try {
                ac = ac || new(window.AudioContext || window.webkitAudioContext)();
                const o = ac.createOscillator();
                const gn = ac.createGain();
                o.type = ty;
                o.frequency.setValueAtTime(f, ac.currentTime);
                o.frequency.linearRampToValueAtTime(f2, ac.currentTime + du);
                gn.gain.setValueAtTime(v, ac.currentTime);
                gn.gain.linearRampToValueAtTime(0, ac.currentTime + du);
                o.connect(gn).connect(sfxBus());
                o.start();
                o.stop(ac.currentTime + du);
            } catch (e) {}
        }

        function nz(du, v = .2, lp = 3000) {
            if (sfxVol <= 0) return;
            try {
                ac = ac || new(window.AudioContext || window.webkitAudioContext)();
                const n = Math.floor(ac.sampleRate * du);
                const b = ac.createBuffer(1, n, ac.sampleRate);
                const d = b.getChannelData(0);
                for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
                const s = ac.createBufferSource();
                const f = ac.createBiquadFilter();
                const gn = ac.createGain();
                f.type = 'lowpass';
                f.frequency.value = lp;
                gn.gain.value = v;
                s.buffer = b;
                s.connect(f).connect(gn).connect(sfxBus());
                s.start();
            } catch (e) {}
        }

        function sfx(n, v = 1) {
            switch (n) {
                case 'step': nz(.05, .25 * v, 900);
                break;
                case 'chop': nz(.05, .5 * v, 2500);
                snd(170, .1, 'square', .4 * v, 85);
                break;
                case 'scrap': snd(1800, .05, 'sine', .3 * v, 1500);
                nz(.06, .2 * v, 6000);
                setTimeout(() => snd(1100, .09, 'sine', .25 * v, 900), 60);
                break;
                case 'build': snd(120, .08, 'square', .4 * v, 70);
                setTimeout(() => snd(140, .08, 'square', .4 * v, 80), 130);
                nz(.1, .2 * v, 2000);
                break;
                case 'break': nz(.35, .5 * v, 1500);
                snd(200, .3, 'square', .3 * v, 60);
                break;
                case 'radio': nz(.15, .18 * v, 5000);
                setTimeout(() => snd(880, .08, 'square', .2 * v), 160);
                setTimeout(() => snd(1320, .08, 'square', .2 * v), 270);
                break;
                case 'screech': snd(1100, .35, 'sawtooth', .22 * v, 350);
                setTimeout(() => snd(900, .2, 'sawtooth', .16 * v, 300), 330);
                break;
                case 'rumble': snd(55, .7, 'square', .35 * v, 35);
                nz(.6, .2 * v, 300);
                break;
                case 'neigh': snd(500, .15, 'sawtooth', .2 * v, 950);
                setTimeout(() => snd(950, .12, 'sawtooth', .2 * v, 700), 150);
                setTimeout(() => snd(700, .2, 'sawtooth', .2 * v, 380), 270);
                break;
                case 'whisper': nz(.9, .25 * v, 4000);
                break;
            }
        }

        let seed = 7;
        const rnd = () => {
            seed |= 0;
            seed = seed + 0x6D2B79F5 | 0;
            let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
        const R = (col, x, y, w, h) => {
            g.fillStyle = col;
            g.fillRect(x | 0, y | 0, w | 0, h | 0);
        };
        const TX = [];
        const ov = document.getElementById('ov');
        const oc = ov.getContext('2d');
        function txt(s, x, y, sz, col, ctr) {
            TX.push({ s, x, y, sz, col, ctr, a: g.globalAlpha });
        }

        function drawTX() {
            const k = ov.width / W;
            oc.clearRect(0, 0, ov.width, ov.height);
            const d = Math.max(1, k / 3);
            for (const t of TX) {
                oc.font = 'bold ' + Math.round(t.sz * k * 1.12) + 'px "Courier New", Courier, monospace';
                oc.textAlign = t.ctr ? 'center' : 'left';
                oc.globalAlpha = Math.max(0, Math.min(1, t.a));
                oc.fillStyle = 'rgba(0,0,0,.88)';
                for (const o of [[-d, -d], [d, -d], [-d, d], [d, d], [0, d], [0, -d], [d, 0], [-d, 0]]) oc.fillText(t.s, t.x * k + o[0], t.y * k + o[1]);
                oc.fillStyle = t.col;
                oc.fillText(t.s, t.x * k, t.y * k);
            }
            oc.globalAlpha = 1;
        }

        function render() {
            fa = null; fb = null;
            TX.length = 0;
            render0();
            drawTX();
            if (st == 'title') drawTitle();
            syncFields();
        }

        function person(x, y, f, fr, mvg, ci) {
            g.fillStyle = 'rgba(0,0,0,.3)';
            g.beginPath();
            g.ellipse(x, y - 1, 8, 2.5, 0, 0, 7);
            g.fill();
            const im = spr[ci];
            if (!ok(im)) {
                R(SH[ci], x - 4, y - 14, 8, 14);
                R('#f1c27d', x - 3, y - 18, 6, 5);
                return;
            }
            const fl = Math.cos(f) < -.5 && Math.abs(Math.sin(f)) < .7;
            const s = mvg ? fr % 2 : 0;
            const b = mvg ? (s ? 0 : -1) : (((gt * 1.6 | 0) % 2) ? -1 : 0);
            g.save();
            g.translate(x | 0, y | 0);
            if (mvg) g.rotate(s?.05: -.05);
            if (fl) g.scale(-1, 1);
            g.drawImage(im, 0, 23, 16, 9, -16, -7 + (mvg ? (s ? 0 : -1) : 0), 16, 9);
            g.drawImage(im, 16, 23, 16, 9, 0, -7 + (mvg ? (s ? -1 : 0) : 0), 16, 9);
            g.drawImage(im, 0, 0, 32, 23, -16, -30 + b, 32, 23);
            g.restore();
            R('#ffe680', x + (fl ? -9 : 8), y - 10, 2, 2);
        }

        function mobSpr(m, x, y) {
            const fr = (m.ph * 6 | 0) % 2;
            const v = vspr[m.t];
            g.fillStyle = 'rgba(0,0,0,.3)';
            g.beginPath();
            g.ellipse(x, y - 1, 6, 2, 0, 0, 7);
            g.fill();
            if (ok(v)) {
                const w = v.naturalWidth;
                const h = v.naturalHeight;
                const b = m.t == 0 ? -8 - Math.sin(m.ph * 5) * 2 : (fr ? -1 : 0);
                g.save();
                if (m.t == 3) g.globalAlpha = .6 + .25 * Math.sin(m.ph * 6);
                g.translate(x | 0, (y - h + 2 + b) | 0);
                if (m.left) {
                    g.translate(w / 2, 0);
                    g.scale(-1, 1);
                } else g.translate(-w / 2, 0);
                g.drawImage(v, 0, 0);
                g.restore();
                return;
            }
            if (m.t == 0) {
                const by = y - 10 - Math.sin(m.ph * 5) * 2;
                const w = fr ? 2 : -3;
                R('#5a1a3a', x - 13, by - 8 + w, 10, 3);
                R('#5a1a3a', x + 3, by - 8 + w, 10, 3);
                R('#e8c9b0', x - 3, by - 8, 6, 8);
                R('#1a0010', x - 4, by - 12, 8, 5);
                R('#f22', x - 2, by - 9, 1, 1);
                R('#f22', x + 1, by - 9, 1, 1);
                R('#a12', x - 1, by, 2, 6 + fr);
            } else if (m.t == 1) {
                R('#2a1a0e', x - 5, y - 8, 4, 8);
                R('#2a1a0e', x + 1, y - 8, 4, 8);
                R('#3d2a17', x - 8, y - 24, 16, 16);
                R('#2a1a0e', x - 5, y - 31, 10, 8);
                R('#f22', x - 3, y - 28, 2, 2);
                R('#f22', x + 1, y - 28, 2, 2);
                R('#999', x + 3, y - 25, 6, 2);
                R((m.ph * 8 | 0) % 2 ? '#ff7a1a' : '#ffc040', x + 9, y - 25, 2, 2);
            } else if (m.t == 2) {
                R('#3a2f27', x - 3, y - 9, 2, 9 - fr);
                R('#3a2f27', x + 1, y - 9, 2, 8 + fr);
                R('#6b5a4a', x - 4, y - 19, 8, 11);
                R('#7a6a58', x - 3, y - 31, 6, 12);
                R('#7a6a58', x - 6, y - 26, 4, 5);
                R('#222', x + 2, y - 31, 2, 12);
                R('#fd0', x - 2, y - 29, 1, 1);
            } else {
                g.save();
                g.globalAlpha = .45 + .25 * Math.sin(m.ph * 6);
                R('#dfe8ff', x - 5, y - 19, 10, 14);
                for (let i = 0; i < 5; i++) R('#dfe8ff', x - 5 + i * 2, y - 5, 2, 2 + ((i + fr) % 2) * 2);
                R('#101020', x - 3, y - 15, 2, 3);
                R('#101020', x + 1, y - 15, 2, 3);
                g.restore();
            }
        }

        function tree(x, y, h) {
            if (h % 7 == 0) {
                R('#08140c', x + 4, y - 10, 8, 28);
                R('#3a2a22', x + 5, y - 9, 6, 26);
                R('#3a2a22', x, y - 9, 6, 3);
                R('#3a2a22', x + 10, y - 13, 6, 3);
                return;
            }
            R('#08140c', x - 3, y - 20, 22, 38);
            R('#4a2f1b', x + 6, y + 8, 4, 8);
            const c = h % 3 ? '#1f6e31' : '#2a7a2a';
            const c2 = '#1a5e2a';
            R(c2, x + 4, y - 18, 8, 6);
            R(c2, x + 1, y - 12, 14, 6);
            R(c, x - 2, y - 6, 20, 8);
            R('#3f9650', x + 4, y - 12, 3, 2);
            R('#144a22', x + 10, y - 3, 6, 2);
        }

        function backdrop() {
            const gr = g.createLinearGradient(0, 0, 0, H);
            gr.addColorStop(0, '#05051a');
            gr.addColorStop(1, '#16263a');
            g.fillStyle = gr;
            g.fillRect(0, 0, W, H);
            seed = 3;
            g.fillStyle = '#fff';
            for (let i = 0; i < 40; i++) {
                const x = rnd() * W;
                const y = rnd() * 100;
                if (((gt * 2 | 0) + i) % 9) g.fillRect(x | 0, y | 0, 1, 1);
            }
            R('#d8cfa0', 276, 14, 24, 24);
            R('#c2b887', 282, 21, 5, 5);
            seed = 9;
            g.fillStyle = '#07110e';
            for (let x = -8; x < W + 8; x += 14) {
                const h = 40 + rnd() * 40;
                g.beginPath();
                g.moveTo(x - 12, H - 8);
                g.lineTo(x, H - 8 - h);
                g.lineTo(x + 12, H - 8);
                g.fill();
            }
            g.fillRect(0, H - 10, W, 10);
            [[60, 140], [190, 148], [270, 138]].forEach((e, i) => {
                if (Math.sin(gt * 1.3 + i * 2) > -.2) {
                    R('#f22', e[0], e[1], 2, 1);
                    R('#f22', e[0] + 5, e[1], 2, 1);
                }
            });
        }

        function btn(s, x, y, w, h, fn) {
            R(lit[s] > gt - .15 ? '#7a2a2a' : '#3a1414', x, y, w, h);
            g.strokeStyle = '#a05030';
            g.lineWidth = 1;
            g.strokeRect(x + .5, y + .5, w - 1, h - 1);
            txt(s, x + w / 2, y + h / 2 + 3, 9, '#ffe0b0', 1);
            btns.push({ x: x - 2, y: y - 2, w: w + 4, h: h + 4, fn, s });
        }

        function hit(x, y, w, h, fn) {
            btns.push({ x, y, w, h, fn, s: '' });
        }

        function rGame() {
            const cx = Math.max(0, Math.min(MW * T - W, me.x - W / 2));
            const cy = Math.max(0, Math.min(MH * T - H, me.y - H / 2 - 6));
            const tx0 = cx / T | 0;
            const ty0 = cy / T | 0;
            const L = [];
            for (let ty = ty0; ty <= Math.min(MH - 1, ty0 + 12); ty++) for (let tx = tx0; tx <= Math.min(MW - 1, tx0 + 21); tx++) {
                const sx = tx * T - cx;
                const sy = ty * T - cy;
                const h = (tx * 73856093 ^ ty * 19349663) & 255;
                const camp = Math.hypot(tx + .5 - MW / 2, ty + .5 - MH / 2) < 4.5;
                R(camp ? (h % 3 ? '#634b32' : '#6e553a') : (h % 4 ? '#2f7040' : '#2a6636'), sx, sy, T, T);
                if (camp) {
                    R('#4a3825', sx + h % 13, sy + (h >> 3) % 13, 2, 1);
                } else {
                    if (h % 3) {
                        R('#45994f', sx + h % 12, sy + (h >> 4) % 12, 1, 3);
                        R('#45994f', sx + h % 12 + 2, sy + (h >> 4) % 12 + 1, 1, 2);
                    }
                    if (h % 29 == 0) {
                        R('#e8a0c0', sx + 3, sy + 5, 2, 2);
                    } else if (h % 61 == 0) {
                        R('#d8d0b8', sx + 3, sy + 8, 6, 1);
                        R('#d8d0b8', sx + 5, sy + 6, 1, 5);
                    }
                }
                if (map[ty][tx] == 1) L.push({ y: ty * T + T, f: () => tree(sx, sy, h) });

                    y: ty * T + T,

        class JR {
            constructor(x) {
                this.s = (BigInt(x) ^ 0x5DEECE66Dn) & ((1n << 48n) - 1n);
            }
            next(b) {
                this.s = (this.s * 0x5DEECE66Dn + 0xBn) & ((1n << 48n) - 1n);
                return Number(this.s >> (48n - BigInt(b)));
            }
            nextDouble() {
                return (this.next(26) * 134217728 + this.next(27)) / 9007199254740992;
            }
            nextInt(n) {
                if ((n & -n) == n) return Number((BigInt(n) * BigInt(this.next(31))) >> 31n);
                let bits;
                let val;
                do {
                    bits = this.next(31);
                    val = bits % n;
                }
                while (bits - val + (n - 1) > 2147483647);
                return val;
            }
        }

        function gen() {
            const r = new JR(7);
            map = [];
            res = [];
            for (let y = 0; y < MH; y++) {
                map[y] = [];
                for (let x = 0; x < MW; x++) {
                    const dd = Math.hypot(x + .5 - MW / 2, y + .5 - MH / 2);
                    let v = 0;
                    if (!x || !y || x == MW - 1 || y == MH - 1) v = 1;
                    else if (dd > 6) {
                        const q = r.nextDouble();
                        v = q < .16 ? 1 : q < .185 ? 2 : 0;
                    }
                    map[y][x] = v;
                }
            }
            for (let i = 0; i < 70; i++) {
                const x = 1 + r.nextInt(MW - 2);
                const y = 1 + r.nextInt(MH - 2);
                if (!map[y][x] && Math.hypot(x - MW / 2, y - MH / 2) > 6) res.push({ x: x * T + 8, y: y * T + 12, t: i % 3 == 0 ? 1 : 0, on: true, rs: 0 });
            }
            buildMaps();
        }

        const solid = (x, y) => {
            const tx = Math.floor(x / T);
            const ty = Math.floor(y / T);
            return tx < 0 || ty < 0 || tx >= MW || ty >= MH || map[ty][tx] > 0;
        };
        const blk = (x, y) => solid(x - 3, y) || solid(x + 3, y) || solid(x - 3, y - 3) || solid(x + 3, y - 3);
        const mv = (p, dx, dy) => {
            if (!blk(p.x + dx, p.y)) p.x += dx;
            if (!blk(p.x, p.y + dy)) p.y += dy;
        };
        const mk = (i, cc) => ({
            id: i,
            ch: cc,
            x: CX + (i - 1.5) * 14,
            y: CY + 24,
            face: 1.57,
            hp: 5,
            an: 0,
            mv: 0,
            atkT: 0,
            atkCd: 0,
            dT: 0,
            dCd: 0,
            hurt: 0,
            bot: 0,
            name: ''
        });
        const frad = () => fire > 0 ? 14 + fire * .35 : 0;
        const nearShel = (x, y, r) => shel.find(q => Math.hypot(q.x - x, q.y - y) < r);
        function canBuild(x, y) {
            if (wood < SHEL_COST) return 'Need ' + SHEL_COST + ' wood to build a shelter';
            if (shel.length >= 3) return 'You can only keep 3 shelters';
            if (solid(x, y) || solid(x - 10, y) || solid(x + 10, y)) return 'No room to build here';
            if (nearShel(x, y, 34) || Math.hypot(x - CX, y - CY) < 36 || Math.hypot(x - RXp, y - RYp) < 24) return 'Too close to something';
            return null;
        }

        function build(p) {
            const x = p.x + Math.cos(p.face) * 22;
            const y = p.y + Math.sin(p.face) * 22;
            const why = canBuild(x, y);
            if (why) {
                say(why);
                return;
            }
            if (rem(p)) {
                send('B ' + (x | 0) + ' ' + (y | 0));
                sfx('build');
                return;
            }
            applyBuild(x, y);
        }

        function applyBuild(x, y) {
            if (canBuild(x, y)) return;
            wood -= SHEL_COST;
            shel.push({ x, y, dur: SHEL_MAX });
            sfx('build');
            say('Shelter built! Monsters keep away.');
        }

        function applyRepair(i) {
            const q = shel[i];
            if (!q || wood <= 0 || q.dur >= SHEL_MAX - 1) return;
            wood--;
            q.dur = Math.min(SHEL_MAX, q.dur + 4);
            sfx('build');
        }

        function spawn() {
            const a = pl.filter(p => p.hp > 0);
            const p = a[Math.random() * a.length | 0];
            if (!p) return;
            const an = Math.random() * 7;
            const m = {
                id: nid++,
                t: Math.random() * 4 | 0,
                x: Math.max(20, Math.min(MW * T - 20, p.x + Math.cos(an) * 160)),
                y: Math.max(20, Math.min(MH * T - 20, p.y + Math.sin(an) * 160)),
                ch: 1,
                ph: 0,
                left: 0
            };
            if (solid(m.x, m.y) && (m.t == 1 || m.t == 2)) m.t = Math.random() < .5 ? 0 : 3;
            m.hp = MHP[m.t];
            mobs.push(m);
            sfx(MSND[m.t], .6);
        }

        function mobAI(m, dt) {
            let t = null;
            let bd = 1e9;
            for (const p of pl) if (p.hp > 0) {
                const dd = Math.hypot(p.x - m.x, p.y - m.y);
                if (dd < bd) {
                    bd = dd;
                    t = p;
                }
            }
            if (!t) return;
            let a = Math.atan2(t.y - m.y, t.x - m.x);
            let sp = MSP[m.t] * (1 + (1 - tl / 300) * .4);
            m.ph += dt;
            if (Math.hypot(m.x - CX, m.y - CY) < frad()) {
                a = Math.atan2(m.y - CY, m.x - CX);
                sp = 55;
            } else if (nearShel(m.x, m.y, 34)) {
                const q = nearShel(m.x, m.y, 34);
                a = Math.atan2(m.y - q.y, m.x - q.x);
                sp = 50;
            } else if (m.t == 2) {
                m.ch -= dt;
                if (m.ch < -4) m.ch = 1;
                if (m.ch > 0) sp *= 2.8;
            }
            let vx = Math.cos(a) * sp * dt;
            let vy = Math.sin(a) * sp * dt;
            if (m.t == 0) {
                vx += Math.cos(m.ph * 3) * .4;
                vy += Math.sin(m.ph * 4) * .4;
            }
            if (Math.abs(vx) > .01) m.left = vx < 0;
            if (m.t == 0 || m.t == 3) {
                m.x += vx;
                m.y += vy;
            } else {
                if (!solid(m.x + vx + Math.sign(vx) * 5, m.y)) m.x += vx;
                if (!solid(m.x, m.y + vy + Math.sign(vy) * 3)) m.y += vy;
            }
        }

        const clearLine = (x0, y0, x1, y1) => {
            const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 5);
            for (let i = 1; i <= n; i++) if (blk(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n)) return false;
            return true;
        };

        function pathStep(sx, sy, gx, gy) {
            if (sx < 0 || sy < 0 || sx >= MW || sy >= MH || map[sy][sx] > 0) return null;
            const start = sy * MW + sx, prev = new Int16Array(MW * MH).fill(-1), q = [start], gs = map[gy][gx] > 0;
            prev[start] = start;
            let found = -1;
            for (let h = 0; h < q.length; h++) {
                const cur = q[h], cx = cur % MW, cy = cur / MW | 0;
                if ((cx == gx && cy == gy) || (gs && Math.abs(cx - gx) + Math.abs(cy - gy) == 1)) { found = cur; break; }
                for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
                    const nx = cx + dx, ny = cy + dy;
                    if (nx < 0 || ny < 0 || nx >= MW || ny >= MH || map[ny][nx] > 0) continue;
                    const ni = ny * MW + nx;
                    if (prev[ni] >= 0) continue;
                    prev[ni] = cur;
                    q.push(ni);
                }
            }
            if (found < 0) return null;
            if (found == start) return [sx, sy];
            let cur = found;
            while (prev[cur] != start) cur = prev[cur];
            return [cur % MW, cur / MW | 0];
        }

        function bot(b, dt) {
            b.ban = b.ban || {};
            b.ptT = (b.ptT || 0) - dt;
            b.jit = (b.jit || 0) - dt;
            b.stk = (b.stk || 0) + dt;
            let tx = b.x, ty = b.y, go = 0, tm = null, bd = 60, ri = -1, hunt = false;
            for (const m of mobs) {
                const dd = Math.hypot(m.x - b.x, m.y - b.y);
                if (dd < bd) { bd = dd; tm = m; }
            }
            const low = b.hp <= 2 && fire > 0;
            if (tm) {
                b.face = Math.atan2(tm.y - b.y, tm.x - b.x);
                if (bd < 24) slash(b);
                if (!low) {
                    hunt = true;
                    if (bd >= 24) { tx = tm.x; ty = tm.y; go = 1; }
                }
            }
            if (!hunt) {
                if (low || (fire < 35 && wood > 0)) { tx = CX; ty = CY; go = 1; }
                else if (scrap > 0) { tx = RXp; ty = RYp; go = 1; }
                else {
                    let rd = 1e9;
                    res.forEach((q, i) => {
                        if (!q.on || (b.ban[i] || 0) > gt) return;
                        const dd = Math.hypot(q.x - b.x, q.y - b.y) + (q.t ? -80 : 0) + b.id * 37 % 50;
                        if (dd < rd) { rd = dd; ri = i; }
                    });
                    if (ri >= 0) { tx = res[ri].x; ty = res[ri].y; go = 1; }
                }
            }
            b.mv = 0;
            if (!go) return;
            const dd = Math.hypot(tx - b.x, ty - b.y);
            if (dd <= 16) {
                if (!tm && b.dCd <= 0) { act(b); b.dCd = .8; }
                return;
            }
            let wx = tx, wy = ty;
            if (!clearLine(b.x, b.y, tx, ty)) {
                if (b.wp && Math.hypot(b.wp[0] - b.x, b.wp[1] - b.y) < 4) b.ptT = 0;
                if (b.ptT <= 0 || !b.wp) {
                    b.ptT = .4;
                    const st2 = pathStep(b.x / T | 0, (b.y - 1) / T | 0, tx / T | 0, ty / T | 0);
                    if (st2) b.wp = [st2[0] * T + T / 2, st2[1] * T + T / 2 + 4];
                    else { b.wp = null; if (ri >= 0) b.ban[ri] = gt + 25; }
                }
                if (b.wp) { wx = b.wp[0]; wy = b.wp[1]; }
            } else b.wp = null;
            let a = Math.atan2(wy - b.y, wx - b.x);
            if (b.jit > 0) a += b.jaw;
            if (!tm) b.face = a;
            mv(b, Math.cos(a) * 48 * dt, Math.sin(a) * 48 * dt);

                b.ly = b.y;

        function newGame(n) {

        const ang = (a, b) => {
            let x = a - b;
            while (x > Math.PI) x -= 6.283;
            while (x < -Math.PI) x += 6.283;
            return x;
        };
        function slash(p) {
            if (p.atkCd > 0) return;
            p.atkCd = .4;
            p.atkT = .15;
            if (p == me) snd(900, .1, 'sawtooth', .08, 200);
            for (const m of [...mobs]) {
                const dx = m.x - p.x;
                const dy = m.y - p.y - 6;
                if (Math.hypot(dx, dy) < 30 && Math.abs(ang(Math.atan2(dy, dx), p.face)) < 1.2) {
                    if (rem(p)) {
                        send('H ' + m.id + ' 2');
                        continue;
                    }
                    m.hp -= 2;
                    const a = Math.atan2(m.y - p.y, m.x - p.x);
                    m.x += Math.cos(a) * 10;
                    m.y += Math.sin(a) * 10;

        function act(p) {
            let r = null;
            let bd = 22;
            for (const q of res) if (q.on) {
                const dd = Math.hypot(q.x - p.x, q.y - p.y);
                if (dd < bd) {
                    bd = dd;
                    r = q;
                }
            }
            if (r) {
                if (rem(p)) {
                    send('G ' + res.indexOf(r));
                    sfx(r.t ? 'scrap' : 'chop');

            if (Math.hypot(p.x - RXp, p.y - RYp) < 30 && scrap > 0) {
                if (rem(p)) {
                    send('R');

                    return;
                }
                scrap--;
                radio = Math.min(100, radio + 12.5);

                if (rem(p)) {
                    send('F');

                    return;
                }
                wood--;
                fire = Math.min(100, fire + 25);
                snd(120, .25, 'sawtooth', .1, 60);

            }
            const q = nearShel(p.x, p.y, 30);

                }
                applyRepair(shel.indexOf(q));
            }
        }

        function tick(dt) {
            toastT -= dt;
            savedT -= dt;
            let ix = 0;
            let iy = 0;
            if (keys.a || keys.arrowleft) ix--;
            if (keys.d || keys.arrowright) ix++;
            if (keys.w || keys.arrowup) iy--;
            if (keys.s || keys.arrowdown) iy++;
            if (joy) {
                const dx = joy.x - joy.ax;
                const dy = joy.y - joy.ay;
                const dd = Math.hypot(dx, dy);
                if (dd > 3) {
                    const m = Math.min(dd, 20) / 20;
                    ix += dx / dd * m;
                    iy += dy / dd * m;
                }
            }
            const l = Math.hypot(ix, iy);
            if (l > 1) {
                ix /= l;
                iy /= l;
            }
            for (const p of pl) {
                p.atkT -= dt;
                p.atkCd -= dt;
                p.dT -= dt;
                p.dCd -= dt;
                p.hurt -= dt;
                if (p.mv) p.an += dt;
            }
            me.mv = l > .1 ? 1 : 0;
            if (me.dT > 0) {
                mv(me, Math.cos(me.face) * 170 * dt, Math.sin(me.face) * 170 * dt);
                me.mv = 1;
            } else if (me.mv) {
                me.face = Math.atan2(iy, ix);
                mv(me, ix * 62 * dt, iy * 62 * dt);
            }
            stepT -= dt;
            if (me.mv && me.dT <= 0 && stepT <= 0) {
                stepT = .3;
                sfx('step', .5);
            }
            mobSndT -= dt;
            if (mobSndT <= 0) {
                mobSndT = 2.5 + Math.random() * 3.5;
                let nm = null;
                let bd = 190;
                for (const m of mobs) {
                    const d = Math.hypot(m.x - me.x, m.y - me.y);
                    if (d < bd) {
                        bd = d;
                        nm = m;
                    }
                }
                if (nm) sfx(MSND[nm.t], 1 - bd / 220);
            }
            const au = !(mode == 2 && !hostF);
            tl -= dt;
            if (au) {
                fire = Math.max(0, fire - 1.2 * dt);
                for (const r of res) if (!r.on && (r.rs -= dt) <= 0) r.on = true;
            } else mobs.forEach(m => m.ph += dt);
            const pg = 1 - tl / 300;
            if (au) spT -= dt;
            if (au && spT <= 0) {
                spT = Math.max(3, 9 - pg * 6);
                if (mobs.length < 2 + pl.length + (pg * 4 | 0)) spawn();
            }
            if (au) {
                mobs.forEach(m => mobAI(m, dt));
                for (let i = shel.length - 1; i >= 0; i--) {
                    const q = shel[i];
                    let n = 0;
                    for (const m of mobs) if (Math.hypot(m.x - q.x, m.y - q.y) < 36) n++;
                    q.dur -= .4 * n * dt;
                    if (q.dur <= 0) {
                        shel.splice(i, 1);
                        sfx('break');
                        say('A shelter was destroyed!');
                    }
                }
                pl.forEach(p => {
                    if (p.bot && p.hp > 0) bot(p, dt);
                });
            }
            if (mode < 2) {
                saveT = (saveT || 10) - dt;
                if (saveT <= 0) {
                    saveT = 10;
                    save();
                }
            }
            netTick(dt);
            const fr = frad();
            for (const p of pl) {
                if (p.hp <= 0 || (mode == 2 && p != me)) continue;
                if (Math.hypot(p.x - CX, p.y - CY) < fr) p.hp = Math.min(5, p.hp + .25 * dt);
                if (nearShel(p.x, p.y, 30)) p.hp = Math.min(5, p.hp + .35 * dt);
                if (p.hurt <= 0) for (const m of mobs) if (Math.hypot(m.x - p.x, m.y - p.y) < 10) {
                    p.hp -= (m.t == 1 || m.t == 2) ? 2 : 1;

                        } catch (e) {}
                    }
                    break;
                }
            }
            if (me.hp <= 0) end(false);
            else if (au) {
                if (radio >= 100) end(true);
                else if (tl <= 0) end(true);
            }
        }

        const rem = p => mode == 2 && !hostF && p == me;
        const rs = m => {
            if (ws && ws.readyState == 1) ws.send(m);
        };
        const send = m => hostF ? rs('* ' + m) : rs(m);
        const relay = (f, m) => rs('*-' + f + ' ' + m);
        const fmt = p => `${p.x|0} ${p.y|0} ${p.face.toFixed(2)} ${p.ch} ${p.hp.toFixed(1)} ${p.mv?1:0} ${encName(p.name)}`;
        function netTick(dt) {
            if (mode != 2) return;
            netT -= dt;
            if (netT > 0) return;
            netT = .06;
            if (!hostF) {
                send('P ' + fmt(me));
                return;
            }
            send('P 0 ' + fmt(me));
            send(`W ${wood} ${scrap} ${Math.round(radio*10)} ${fire|0} ${Math.round(tl*10)} ` + res.map(r => r.on ? 1 : 0).join(''));
            send('M ' + mobs.length + mobs.map(m => ` ${m.id} ${m.t} ${m.x|0} ${m.y|0} ${Math.ceil(m.hp)}`).join(''));
            send('S ' + shel.length + shel.map(q => ` ${q.x|0} ${q.y|0} ${Math.round(q.dur*10)}`).join(''));
        }

        function handle(from, a) {
            const c = a[0];
            if (hostF) {
                const p = pl && pl[from];
                if (c == 'P') {
                    if (p) {
                        p.x = +a[1];
                        p.y = +a[2];
                        p.face = +a[3];
                        p.ch = +a[4];
                        p.hp = +a[5];
                        p.mv = a[6] == '1' ? 1 : 0;
                        if (a[7] !== undefined) p.name = decName(a[7]);
                    }
                    relay(from, 'P ' + from + ' ' + a.slice(1).join(' '));
                } else if (c == 'G') {
                    const r = res[+a[1]];
                    if (r && r.on) {
                        r.on = false;
                        r.rs = 35;
                        r.t ? scrap++ : wood++;
                    }
                } else if (c == 'F') {
                    if (wood > 0) {
                        wood--;
                        fire = Math.min(100, fire + 25);
                    }
                } else if (c == 'R') {
                    if (scrap > 0) {
                        scrap--;
                        radio = Math.min(100, radio + 12.5);
                    }
                } else if (c == 'B') {
                    applyBuild(+a[1], +a[2]);
                } else if (c == 'A') {
                    applyRepair(+a[1]);
                } else if (c == 'H') {
                    const m = mobs.find(o => o.id == +a[1]);
                    if (m) {
                        m.hp -= +a[2];
                        if (m.hp <= 0) mobs.splice(mobs.indexOf(m), 1);
                    }
                }
                return;
            }
            if (c == 'I') myId = +a[1];
            else if (c == 'GO') newGame(+a[1]);
            else if (c == 'P') {
                const p = pl && pl[+a[1]];
                if (p && p != me) {
                    p.x = +a[2];
                    p.y = +a[3];
                    p.face = +a[4];
                    p.ch = +a[5];
                    p.hp = +a[6];
                    p.mv = a[7] == '1' ? 1 : 0;
                    if (a[8] !== undefined) p.name = decName(a[8]);
                }
            } else if (c == 'W' && st == 'game') {
                wood = +a[1];
                scrap = +a[2];
                radio = a[3] / 10;
                fire = +a[4];
                tl = a[5] / 10;
                for (let i = 0; i < res.length; i++) res[i].on = a[6][i] == '1';
            } else if (c == 'S' && st == 'game') {
                const n = +a[1];
                const ns = [];
                for (let i = 0; i < n; i++) ns.push({ x: +a[2 + i * 3], y: +a[3 + i * 3], dur: a[4 + i * 3] / 10 });
                shel = ns;
            } else if (c == 'M' && st == 'game') {
                const n = +a[1];
                const nm = [];
                for (let i = 0; i < n; i++) {
                    const b = 2 + i * 5;
                    const o = mobs.find(q => q.id == +a[b]);
                    const m = {
                        id: +a[b],
                        t: +a[b + 1],
                        x: +a[b + 2],
                        y: +a[b + 3],
                        hp: +a[b + 4],
                        ph: o ? o.ph : 0,
                        left: 0,
                        ch: 1
                    };
                    if (o) m.left = m.x < o.x || (m.x == o.x && o.left);

                }

            } else if (c == 'E') end(a[1] == '1');
        }

        function closeNet() {
            netTry++;
            const w = ws;
            ws = null;
            try { w && w.close(); } catch (e) {}
            hostF = false;
            joined = 0;
        }

        function wrapTxt(s, x, y, sz, col, n) {
            let ln = '';
            for (const t of String(s || '').split(' ')) {
                if ((ln + ' ' + t).trim().length > n) { txt(ln, x, y, sz, col, 1); y += sz + 2; ln = t; }
                else ln = (ln + ' ' + t).trim();
            }
            if (ln) txt(ln, x, y, sz, col, 1);

        // Put your online relay here once, e.g. 'wss://lastcamp.onrender.com'. Then players only type the room code.
        const RELAY_URL = '';

        function relayList() {
            const sec = location.protocol == 'https:', pre = sec ? 'wss://' : 'ws://', out = [];
            const typed = srvVal.trim().replace(/^(wss?|https?):\/\//, '').replace(/\/.*$/, '');
            if (typed) out.push(pre + (typed.includes(':') ? typed : typed + ':5050'));
            if (RELAY_URL) out.push(RELAY_URL);
            if (location.protocol.startsWith('http')) {
                out.push(pre + location.host);
                if (!sec && location.port != '5050') out.push('ws://' + location.hostname + ':5050');
            } else if (!typed) out.push('ws://localhost:5050');
            out.push('ws://localhost:5050');
            return out.filter((v, i) => out.indexOf(v) == i);
        }

        function joinGame() {
            if (joinCode.length < 4) { netMsg = 'Enter the 4-letter room code first.'; return; }
            connect('JOIN ' + joinCode);
        }

        const ERRS = { 'no such room': 'No room has that code. Check it with the host.', 'room is full': 'That room is full.', 'host left': 'The host left the camp.' };

        function connect(first) {
            closeNet();
            const list = relayList(), tk = ++netTry;
            mode = 2;
            hostF = first.startsWith('HOST');
            joined = 0;
            netMsg = 'Connecting...';
            const attempt = i => {
                if (tk != netTry) return;
                if (i >= list.length) {
                    netMsg = 'Cannot reach the server. Start TheLastCampServer on this PC first (it uses localhost:5050).';
                    srvAsk = true;
                    ws = null;
                    return;
                }
                let w, opened = false;
                try { w = new WebSocket(list[i]); } catch (e) { attempt(i + 1); return; }
                ws = w;
                const to = setTimeout(() => { if (!opened) try { w.close(); } catch (e) {} }, 3500);
                w.onopen = () => {
                    opened = true;
                    clearTimeout(to);
                    if (srvVal.trim()) try { localStorage.setItem('lcserver2', srvVal.trim()); } catch (e) {}
                    netMsg = 'Connected...';
                    w.send(first);
                };
                w.onerror = () => {};
                w.onclose = () => {
                    clearTimeout(to);
                    if (tk != netTry || ws != w) return;
                    if (!opened) attempt(i + 1);
                    else if (st == 'lobby' || st == 'game') netMsg = 'Disconnected from relay';
                };
                w.onmessage = e => {
                    try {
                        const l = e.data;
                        if (l.startsWith('CODE ')) { code = l.slice(5); netMsg = ''; st = 'lobby'; return; }
                        if (l.startsWith('ERR')) {
                            const er = l.slice(4) || 'error';
                            netMsg = ERRS[er] || er;
                            if (st == 'game') { end(false); msg = netMsg; } else st = 'mp';
                            return;
                        }
                        if (!hostF) {
                            if (st == 'mp') { st = 'lobby'; netMsg = ''; }
                            handle(0, l.split(' '));
                            return;
                        }
                        const sp = l.indexOf(' '), id = +l.slice(0, sp), rest = l.slice(sp + 1);
                        if (rest == 'JOINED') joined++;
                        else if (rest == 'LEFT') joined = Math.max(0, joined - 1);
                        else handle(id, rest.split(' '));
                    } catch (err) {}
                };
            };
            attempt(0);
        }

        const fEl = [document.getElementById('fa'), document.getElementById('fb')];

                    sty.textTransform = f.id == 'code' ? 'uppercase' : 'none';
                    el.placeholder = f.ph;
                    el.maxLength = f.max;
                    el.dataset.id = f.id;

        let last = performance.now();

        let rot = false;

        addEventListener('resize', fit);

        // Phones: first tap anywhere goes fullscreen and locks landscape (Android Chrome)
        if (matchMedia('(pointer: coarse)').matches) {

        c.addEventListener('pointerdown', e => {

            const p = pos(e);
            startMusic();
            if (st == 'char') swipeX = p.x;
            if (touchOn && !fullTried) {
                fullTried = true;
                goFull();
            }
            for (let i = btns.length - 1; i >= 0; i--) {
                const b = btns[i];
                if (p.x >= b.x && p.x < b.x + b.w && p.y >= b.y && p.y < b.y + b.h) {
                    lit[b.s] = gt;
                    snd(800, .04, 'sine', .12);
                    b.fn();
                    return;
                }
            }
            if (st == 'game' && !panel && p.x < W * .55 && p.y > 40 && !joy) joy = { id: e.pointerId, ax: p.x, ay: p.y, x: p.x, y: p.y };
        });
        addEventListener('contextmenu', e => e.preventDefault());
        c.addEventListener('pointermove', e => {
            if (st == 'char') {
                const p = pos(e);
                if (e.pointerType == 'mouse' && !e.buttons) {
                    if (p.y > 34 && p.y < 146) ch = Math.max(0, Math.min(3, p.x / 80 | 0));
                } else if (swipeX !== null) {
                    if (p.x - swipeX > 22) { ch = Math.min(3, ch + 1); swipeX = p.x; }
                    else if (swipeX - p.x > 22) { ch = Math.max(0, ch - 1); swipeX = p.x; }
                }
            }
            if (joy && joy.id == e.pointerId) {
                const p = pos(e);
                joy.x = p.x;
                joy.y = p.y;
            }
        });
        const up = e => {
            swipeX = null;
            if (joy && joy.id == e.pointerId) joy = null;
        };
        c.addEventListener('pointerup', up);
        c.addEventListener('pointercancel', up);
        addEventListener('keydown', e => {
            if (e.target && e.target.tagName == 'INPUT') return;
            const k = e.key.toLowerCase();
            keys[k] = 1;
            startMusic();
            if (st == 'title' && stT > 3.6 && (k == 'enter' || k == ' ')) startGame0();
            if (st == 'name') {
                if (k == 'enter') confirmName();
                else if (e.key.length == 1) fEl[0].focus();
            }
            if (st == 'char') {
                if (k == 'arrowleft' || k == 'a') ch = Math.max(0, ch - 1);
                if (k == 'arrowright' || k == 'd') ch = Math.min(3, ch + 1);
            }
            if (st == 'beast') {
                if (k == 'enter' || k == ' ' || k == 'arrowright') beastNext();
                if (k == 'arrowleft' && beastPg > 0) beastPg--;
                if (k == 'escape') beastGo();
            }
            if (st == 'instr' && (k == 'escape' || k == 'enter')) st = instrReturn;
            if (st == 'lore' && (k == ' ' || k == 'enter')) {
                st = 'mode';
                stT = 0;
            }
            if (st == 'game') {
                if (k == ' ' || k == 'j') slash(me);
                if (k == 'e' || k == 'enter') act(me);
                if (k == 'shift' || k == 'k') dash(me);
                if (k == 'f') flash = !flash;
                if (k == 'b') build(me);
                if (k == 'i') panel = panel == 1 ? 0 : 1;
                if (k == 'm') panel = panel == 3 ? 0 : 3;
                if (k == 'escape') panel = panel ? 0 : 2;
            }
            if ([' ', 'arrowup', 'arrowdown'].includes(k)) e.preventDefault();
        });
        addEventListener('visibilitychange', () => { if (document.hidden && st == 'game') save(); });
        addEventListener('pagehide', () => { if (st == 'game') save(); });
        addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = 0;
