            if (sfxVol <= 0) return;
            try {
                ac = ac || new(window.AudioContext || window.webkitAudioContext)();
                const o = ac.createOscillator();
                const gn = ac.createGain();
                o.type = ty;
                o.frequency.setValueAtTime(f, ac.currentTime);
                o.frequency.linearRampToValueAtTime(f2, ac.currentTime + du);
                gn.gain.setValueAtTime(v, ac.currentTime);
                gn.gain.linearRampToValueAtTime(0, ac.currentTime + du);
                o.connect(gn).connect(sfxBus());
                o.start();
                o.stop(ac.currentTime + du);
            } catch (e) {}
        }

        function nz(du, v = .2, lp = 3000) {
            if (sfxVol <= 0) return;
            try {
                ac = ac || new(window.AudioContext || window.webkitAudioContext)();
                const n = Math.floor(ac.sampleRate * du);
                const b = ac.createBuffer(1, n, ac.sampleRate);
                const d = b.getChannelData(0);
                for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
                const s = ac.createBufferSource();
                const f = ac.createBiquadFilter();
                const gn = ac.createGain();
                f.type = 'lowpass';
                f.frequency.value = lp;
                gn.gain.value = v;
                s.buffer = b;
                s.connect(f).connect(gn).connect(sfxBus());
                s.start();
            } catch (e) {}
        }

                    d.moveTo(x, y);
                    d.arc(x, y, 100, p.face - .45, p.face + .45);
                    d.closePath();
                    d.fill();
                }
            }
            g.drawImage(dk, 0, 0);
            hud();
        }

        function hud() {
            if (me.curse > 0) {
                g.fillStyle = 'rgba(140,50,200,' + (.13 + .06 * Math.sin(gt * 10)) + ')';
                g.fillRect(0, 0, W, H);
                txt('CURSED  ' + Math.ceil(me.curse) + 's', W / 2, 22, 8, '#d090ff', 1);
            }
            for (let i = 0; i < 5; i++) R(me.hp > i ? '#e03040' : '#401820', 4 + i * 8, 4, 6, 5);
            txt('WOOD ' + wood + '  BATTERY ' + scrap, 4, 22, 8, '#ffe0b0');
            R('#222', 4, 26, 62, 5);
            R('#40c0ff', 4, 26, 62 * radio / 100, 5);
            txt('RADIO ' + Math.round(radio * needB / 100) + '/' + needB, 68, 32, 7, '#80d0ff');
            R('#222', 4, 34, 62, 5);
            R('#ff9030', 4, 34, 62 * fire / 100, 5);
            txt('FIRE', 68, 40, 7, '#ffb060');
            const hr = (300 - tl) / 300 * 6;
            const hh = hr | 0;
            txt((hh || 12) + ':' + String((hr - hh) * 60 | 0).padStart(2, '0') + ' AM', W / 2, 11, 9, '#e8e0ff', 1);
            if (toastT > 0) txt(toast, W / 2, 62, 8, '#fff', 1);
            if (savedT > 0) txt('SAVED', 4, H - 4, 7, '#80ff80');
            if (joy) {
                g.fillStyle = 'rgba(255,255,255,.25)';
                g.beginPath();
                g.arc(joy.ax, joy.ay, 18, 0, 7);
                g.fill();
                const dx = joy.x - joy.ax;
                const dy = joy.y - joy.ay;
                const dd = Math.max(1, Math.hypot(dx, dy));
                const m = Math.min(dd, 20);
                g.fillStyle = 'rgba(255,255,255,.5)';
                g.beginPath();
                g.arc(joy.ax + dx / dd * m, joy.ay + dy / dd * m, 7, 0, 7);
                g.fill();
            }
            if (touchOn && !joy && !panel) {
                g.strokeStyle = 'rgba(255,255,255,.25)';
                g.lineWidth = 1;
                g.beginPath();
                g.arc(46, 136, 22, 0, 7);
                g.stroke();
                g.fillStyle = 'rgba(255,255,255,.12)';
                g.beginPath();
                g.arc(46, 136, 9, 0, 7);
                g.fill();
            }
            drawMini();
            if (!quest) {
                btn('BAG', 280, 3, 36, 15, () => panel = panel == 1 ? 0 : 1);
                btn('SET', 280, 20, 36, 15, () => panel = panel == 2 ? 0 : 2);
                btn('MAP', 280, 37, 36, 15, () => panel = panel == 3 ? 0 : 3);
            }
            if (mode == 2 && me.hp <= 0 && !panel) {
                const vp = viewP();
                txt('YOU DIED - WATCHING', W / 2, 24, 8, '#ff6060', 1);
                txt(vp == me ? '' : (vp.name || 'PLAYER ' + (vp.id + 1)), W / 2, 34, 8, '#fff', 1);
                btn('<', 96, 150, 30, 16, () => specIdx--);
                btn('>', 194, 150, 30, 16, () => specIdx++);
                txt('You cannot come back until the game ends', W / 2, 174, 6, '#b0a090', 1);
            }
            if (!panel && !(mode == 2 && me.hp <= 0)) {
                btn('SLASH', 262, 138, 52, 30, () => slash(me));
                btn('DASH', 262, 104, 52, 26, () => dash(me));
                R('#222', 262, 98, 52, 4);
                R(me.dCd > 0 ? '#e0c040' : '#40e060', 262, 98, 52 * (me.dCd > 0 ? Math.max(0, 1 - me.dCd / 2.5) : 1), 4);

                btn('BUILD', 204, 116, 50, 24, () => build(me));

                R('#1c1410', 52, 28, 216, 118);
                g.strokeStyle = '#a05030';
                g.strokeRect(52.5, 28.5, 215, 117);

                    txt('INVENTORY', W / 2, 42, 10, '#ffe0b0', 1);

                        ['TORCH', flash ? 'ON' : 'OFF'],

                        ['WOOD x' + wood, 'fire/B build'],

                        g.strokeStyle = '#70452d';

                        txt(o[0], x + 21, 88, 6, '#ffe0b0', 1);

                        if (i == 0) {
                            R('#777', x + 8, 72, 18, 6);
                            R(flash ? '#ffe680' : '#554', x + 26, 70, 5, 10);
                            hit(x, 50, 42, 46, () => flash = !flash);

        function mapDots(x0, y0, sc, big) {
            const px = v => x0 + v / T * sc, py = v => y0 + v / T * sc, z = big ? 5 : 2;
            const dot = (x, y, col, n) => { g.fillStyle = col; g.fillRect(px(x) - n / 2 | 0, py(y) - n / 2 | 0, n, n); };
            for (const r of res) if (r.on) r.t ? dot(r.x, r.y, (gt * 3 | 0) % 2 ? '#ffe060' : '#ffb020', z + 1) : dot(r.x, r.y, '#d9954a', z);
            for (const q of shel) dot(q.x, q.y, '#c89a60', z);
            for (const q of punso) if (!q.done) dot(q.x, q.y, '#c070ff', z);
            dot(CX, CY, '#ff7a1a', z + 1);
            dot(RXp, RYp, '#40c0ff', z + 1);
            for (const m of mobs) if (Math.hypot(m.x - me.x, m.y - me.y) < 170) dot(m.x, m.y, '#ff3030', z);
            for (const p of pl) if (p.hp > 0) dot(p.x, p.y, p == me ? ((gt * 4 | 0) % 2 ? '#fff' : '#8cf') : '#80ff80', z + 1);
        }

        function buildMaps() {
            mmC = document.createElement('canvas');
            mmC.width = MW;
            mmC.height = MH;
            const m = mmC.getContext('2d');
            for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
                const v = map[y][x];
                m.fillStyle = v == 1 ? '#0f2e17' : v == 2 ? '#6a6d76' : Math.hypot(x + .5 - MW / 2, y + .5 - MH / 2) < 4.5 ? '#5a4630' : '#235232';
                m.fillRect(x, y, 1, 1);
            }
        }

                return;

            nameMsg = '';

        function beastNext() {
            if (beastPg < BEAST.length - 1) beastPg++;

        function rBeast() {
            backdrop();
            g.fillStyle = 'rgba(0,0,0,.6)';
            g.fillRect(0, 0, W, H);
            const b = BEAST[beastPg];
            txt('KNOW YOUR ENEMY  (' + (beastPg + 1) + '/' + BEAST.length + ')', W / 2, 14, 10, '#ffd070', 1);
            R('#140c0c', 14, 22, 104, 124);
            g.strokeStyle = '#a05030';
            g.strokeRect(14.5, 22.5, 103, 123);
            const gr = g.createRadialGradient(66, 90, 4, 66, 90, 56);
            gr.addColorStop(0, 'rgba(160,20,20,.45)');
            gr.addColorStop(1, 'rgba(160,20,20,0)');
            g.fillStyle = gr;
            g.fillRect(15, 23, 102, 122);
            if (b.d) {
                if (ok(duw)) g.drawImage(duw, 18, 42, 96, 96);
            } else {
                g.save();
                g.translate(66, 138);
                g.scale(1.5, 1.5);
                mobSpr({ t: beastPg, ph: gt, left: false }, 0, 0);
                g.restore();
            }
            txt(b.n, 126, 36, 12, '#ff7060');
            txt(b.a, 126, 47, 7, '#b0a090');
            b.i.forEach((l, i) => txt(l, 126, 62 + i * 10, 7, '#e8dcb0'));

            txt('TIP: ' + b.tip, 126, 136, 7, '#80d0ff');
            if (beastPg > 0) btn('BACK', 14, 152, 50, 16, () => beastPg--);

        const TW = TPATH.map(l => {

            for (const c of l) for (let i = 0; i < c.length; i += 2) m = Math.max(m, Math.abs(c[i]));
            return 2 * m;
        });
        function tpath(c, li, cx, by, fs) {
            c.beginPath();
            for (const q of TPATH[li]) {
                c.moveTo(cx + q[0] * fs, by + q[1] * fs);
                for (let i = 2; i < q.length; i += 2) c.lineTo(cx + q[i] * fs, by + q[i + 1] * fs);

            }
        }

        function drawTitle() {
            const k = ov.width / W;
            const lines = ['THE LAST', 'CAMP'];
            const size = [30, 54];
            const base = [50, 98];
            const fk = 0;
            for (let li = 0; li < 2; li++) {
                const fs = Math.round(size[li] * k);
                const by = base[li] * k;
                const cx = ov.width / 2;
                oc.lineJoin = 'round';
                for (let j = 3; j >= 1; j--) {
                    oc.lineWidth = k * j * 2.4;
                    oc.strokeStyle = 'rgba(150,0,0,.15)';
                    tpath(oc, li, cx, by, fs);
                    oc.stroke();
                }
                oc.lineWidth = k * 2.2;
                oc.strokeStyle = '#0a0000';
                tpath(oc, li, cx, by, fs);
                oc.stroke();
                const gr = oc.createLinearGradient(0, by - fs * .8, 0, by);
                gr.addColorStop(0, '#f6ecd4');
                gr.addColorStop(1, '#c01c1c');
                oc.fillStyle = gr;
                tpath(oc, li, cx, by, fs);
                oc.fill('evenodd');
                const key = li + ':' + fs + ':' + ov.width + ':' + fk;
                let cols = dripCache[key];
                if (!cols) {
                    cols = [];
                    const mc = document.createElement('canvas');
                    mc.width = Math.ceil(TW[li] * fs + 20);
                    mc.height = Math.ceil(fs * 1.3);
                    const mx = mc.getContext('2d');
                    mx.fillStyle = '#fff';
                    tpath(mx, li, mc.width / 2, fs, fs);
                    mx.fill('evenodd');
                    const d = mx.getImageData(0, 0, mc.width, mc.height).data;
                    const step = Math.max(4, Math.round(k * 3));
                    for (let x = 2; x < mc.width - 2; x += step) {
                        let bot = -1;
                        for (let y = mc.height - 1; y >= 0; y--) if (d[(y * mc.width + x) * 4 + 3] > 128) {
                            bot = y;
                            break;
                        }
                        if (bot >= 0) cols.push([cx - mc.width / 2 + x, by - fs + bot, (x * 7 + li * 13) % 100]);
                    }
                    dripCache[key] = cols;
                }
                for (const c of cols) if (c[2] < 42) {
                    const len = (6 + c[2] % 12) * k * (.55 + .45 * Math.sin(gt * .8 + c[2])) * (li ? 1 : .5);
                    const dw = Math.max(2, k);
                    oc.fillStyle = '#a81414';
                    oc.fillRect(c[0] - dw / 2, c[1] - 1, dw, len);
                    oc.fillStyle = '#e02828';
                    oc.beginPath();
                    oc.arc(c[0], c[1] + len, dw, 0, 7);
                    oc.fill();
                }
            }
        }

        class JR {
            constructor(x) {
                this.s = (BigInt(x) ^ 0x5DEECE66Dn) & ((1n << 48n) - 1n);
            }
            next(b) {
                this.s = (this.s * 0x5DEECE66Dn + 0xBn) & ((1n << 48n) - 1n);
                return Number(this.s >> (48n - BigInt(b)));
            }
            nextDouble() {
                return (this.next(26) * 134217728 + this.next(27)) / 9007199254740992;
            }
            nextInt(n) {
                if ((n & -n) == n) return Number((BigInt(n) * BigInt(this.next(31))) >> 31n);
                let bits;
                let val;
                do {
                    bits = this.next(31);
                    val = bits % n;
                }
                while (bits - val + (n - 1) > 2147483647);
                return val;
            }
        }

        // 6 punso (earth mounds where a Duwende lives). Same formula in the Java game, so every device gets the same spots
        function genPunso() {
            punso = [];
            for (let k = 0; k < 6; k++) {
                for (let s = 0; s < 400; s++) {
                    const tx = 5 + ((k * 37 + 11 + s * 7) % 54);
                    const ty = 5 + ((k * 23 + 5 + s * 5) % 38);
                    if (map[ty][tx]) continue;
                    if (Math.hypot(tx + .5 - MW / 2, ty + .5 - MH / 2) < 10) continue;
                    let near = false;
                    for (const o of punso) if (Math.hypot(o.tx - tx, o.ty - ty) < 12) near = true;
                    if (near) continue;
                    punso.push({ tx, ty, x: tx * T + 8, y: ty * T + 12, done: false });
                    break;
                }
            }
        }

        function startQuest(k) {
            const d = QUIZ[Math.random() * QUIZ.length | 0];
            const opts = d[1].map((t, i) => ({ t, ok: i == d[2] }));

                const j = Math.random() * (i + 1) | 0;
                const tmp = opts[i];
                opts[i] = opts[j];
                opts[j] = tmp;
            }
            punso[k].done = true;
            quest = { k, q: d[0], opts };
            panel = 4;
            me.hurt = Math.max(me.hurt, 6);
            snd(300, .3, 'triangle', .15, 520);
        }

        }

        function gen() {
            const r = new JR(7);
            map = [];
            res = [];
            for (let y = 0; y < MH; y++) {
                map[y] = [];
                for (let x = 0; x < MW; x++) {
                    const dd = Math.hypot(x + .5 - MW / 2, y + .5 - MH / 2);
                    let v = 0;
                    if (!x || !y || x == MW - 1 || y == MH - 1) v = 1;
                    else if (dd > 6) {
                        const q = r.nextDouble();
                        v = q < .16 ? 1 : q < .185 ? 2 : 0;
                    }
                    map[y][x] = v;
                }
            }
            for (let i = 0; i < 70; i++) {
                const x = 1 + r.nextInt(MW - 2);
                const y = 1 + r.nextInt(MH - 2);
                if (!map[y][x] && Math.hypot(x - MW / 2, y - MH / 2) > 6) res.push({ x: x * T + 8, y: y * T + 12, t: i % 3 == 0 ? 1 : 0, on: true, rs: 0 });
            }
            genPunso();
            buildMaps();
        }

        const solid = (x, y) => {
            const tx = Math.floor(x / T);
            const ty = Math.floor(y / T);
            return tx < 0 || ty < 0 || tx >= MW || ty >= MH || map[ty][tx] > 0;
        };
        const blk = (x, y) => solid(x - 3, y) || solid(x + 3, y) || solid(x - 3, y - 3) || solid(x + 3, y - 3);
        const mv = (p, dx, dy) => {
            if (!blk(p.x + dx, p.y)) p.x += dx;
            if (!blk(p.x, p.y + dy)) p.y += dy;
        };
        const mk = (i, cc) => ({
            id: i,
            ch: cc,
            x: CX + ((i % 5) - 2) * 14,
            y: CY + 24 + (i / 5 | 0) * 14,
            face: 1.57,
            hp: 5,
            an: 0,
            mv: 0,
            atkT: 0,
            atkCd: 0,
            dT: 0,
            dCd: 0,
            curse: 0,
            hurt: 0,
            bot: 0,
            name: ''
        });
        const frad = () => fire > 0 ? 14 + fire * .35 : 0;
        const nearShel = (x, y, r) => shel.find(q => Math.hypot(q.x - x, q.y - y) < r);
        function canBuild(x, y, free) {
            if (!free && wood < SHEL_COST) return 'Need ' + SHEL_COST + ' wood to build a shelter';
            if (shel.length >= 3) return 'You can only keep 3 shelters';
            if (solid(x, y) || solid(x - 10, y) || solid(x + 10, y)) return 'No room to build here';
            if (nearShel(x, y, 34) || Math.hypot(x - CX, y - CY) < 36 || Math.hypot(x - RXp, y - RYp) < 24) return 'Too close to something';
            return null;
        }

        function build(p) {
            if (p.hp <= 0 || (quest && p == me)) return;
            const x = p.x + Math.cos(p.face) * 22;
            const y = p.y + Math.sin(p.face) * 22;
            const why = canBuild(x, y);
            if (why) {
                say(why);
                return;
            }
            if (rem(p)) {
                wood -= SHEL_COST;
                send('B ' + (x | 0) + ' ' + (y | 0));
                sfx('build');
                return;
            }
            applyBuild(x, y);
        }

        function applyBuild(x, y, free) {
            if (canBuild(x, y, free)) return false;
            if (!free) wood -= SHEL_COST;
            shel.push({ x, y, dur: SHEL_MAX });
            sfx('build');
            say('Shelter built! Monsters keep away.');
            return true;
        }

        function applyRepair(i, free) {
            const q = shel[i];
            if (!q || (!free && wood <= 0) || q.dur >= SHEL_MAX - 1) return false;
            if (!free) wood--;
            q.dur = Math.min(SHEL_MAX, q.dur + 4);
            sfx('build');
            return true;
        }

        function spawn() {
            const a = pl.filter(p => p.hp > 0);
            const p = a[Math.random() * a.length | 0];
            if (!p) return;
            const an = Math.random() * 7;
            const m = {
                id: nid++,
                t: Math.random() * 4 | 0,
                x: Math.max(20, Math.min(MW * T - 20, p.x + Math.cos(an) * 160)),
                y: Math.max(20, Math.min(MH * T - 20, p.y + Math.sin(an) * 160)),
                ch: 1,
                ph: 0,
                left: 0
            };
            if (solid(m.x, m.y) && (m.t == 1 || m.t == 2)) m.t = Math.random() < .5 ? 0 : 3;
            m.hp = MHP[m.t];
            mobs.push(m);
            sfx(MSND[m.t], .6);
        }

        function mobAI(m, dt) {
            let t = null;
            let bd = 1e9;
            for (const p of pl) if (p.hp > 0) {
                const dd = Math.hypot(p.x - m.x, p.y - m.y);
                if (dd < bd) {
                    bd = dd;
                    t = p;
                }
            }
            if (!t) return;
            let a = Math.atan2(t.y - m.y, t.x - m.x);
            let sp = MSP[m.t] * (1 + (1 - tl / 300) * .4);
            m.ph += dt;
            if (Math.hypot(m.x - CX, m.y - CY) < frad()) {
                a = Math.atan2(m.y - CY, m.x - CX);
                sp = 55;
            } else if (nearShel(m.x, m.y, 34)) {
                const q = nearShel(m.x, m.y, 34);
                a = Math.atan2(m.y - q.y, m.x - q.x);
                sp = 50;
            } else if (m.t == 2) {
                m.ch -= dt;
                if (m.ch < -4) m.ch = 1;
                if (m.ch > 0) sp *= 2.8;
            }
            let vx = Math.cos(a) * sp * dt;
            let vy = Math.sin(a) * sp * dt;
            if (m.t == 0) {
                vx += Math.cos(m.ph * 3) * .4;
                vy += Math.sin(m.ph * 4) * .4;
            }
            if (Math.abs(vx) > .01) m.left = vx < 0;
            if (m.t == 0 || m.t == 3) {
                m.x += vx;
                m.y += vy;
            } else {
                if (!solid(m.x + vx + Math.sign(vx) * 5, m.y)) m.x += vx;
                if (!solid(m.x, m.y + vy + Math.sign(vy) * 3)) m.y += vy;
            }
        }

        const clearLine = (x0, y0, x1, y1) => {
            const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 5);
            for (let i = 1; i <= n; i++) if (blk(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n)) return false;
            return true;
        };

        function pathStep(sx, sy, gx, gy) {
            if (sx < 0 || sy < 0 || sx >= MW || sy >= MH || map[sy][sx] > 0) return null;
            const start = sy * MW + sx, prev = new Int16Array(MW * MH).fill(-1), q = [start], gs = map[gy][gx] > 0;
            prev[start] = start;
            let found = -1;
            for (let h = 0; h < q.length; h++) {
                const cur = q[h], cx = cur % MW, cy = cur / MW | 0;
                if ((cx == gx && cy == gy) || (gs && Math.abs(cx - gx) + Math.abs(cy - gy) == 1)) { found = cur; break; }
                for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
                    const nx = cx + dx, ny = cy + dy;
                    if (nx < 0 || ny < 0 || nx >= MW || ny >= MH || map[ny][nx] > 0) continue;
                    const ni = ny * MW + nx;
                    if (prev[ni] >= 0) continue;
                    prev[ni] = cur;
                    q.push(ni);
                }
            }
            if (found < 0) return null;
            if (found == start) return [sx, sy];
            let cur = found;
            while (prev[cur] != start) cur = prev[cur];
            return [cur % MW, cur / MW | 0];
        }

        function bot(b, dt) {
            b.ban = b.ban || {};
            b.ptT = (b.ptT || 0) - dt;
            b.jit = (b.jit || 0) - dt;
            b.stk = (b.stk || 0) + dt;
            let tx = b.x, ty = b.y, go = 0, tm = null, bd = 60, ri = -1, hunt = false;
            for (const m of mobs) {
                const dd = Math.hypot(m.x - b.x, m.y - b.y);
                if (dd < bd) { bd = dd; tm = m; }
            }
            const low = b.hp <= 2 && fire > 0;
            if (tm) {
                b.face = Math.atan2(tm.y - b.y, tm.x - b.x);
                if (bd < 24) slash(b);
                if (!low) {
                    hunt = true;
                    if (bd >= 24) { tx = tm.x; ty = tm.y; go = 1; }
                }
            }
            if (!hunt) {
                if (low || (fire < 35 && wood > 0)) { tx = CX; ty = CY; go = 1; }
                else if (scrap > 0) { tx = RXp; ty = RYp; go = 1; }
                else {
                    let rd = 1e9;
                    res.forEach((q, i) => {
                        if (!q.on || (b.ban[i] || 0) > gt) return;
                        const dd = Math.hypot(q.x - b.x, q.y - b.y) + (q.t ? -80 : 0) + b.id * 37 % 50;
                        if (dd < rd) { rd = dd; ri = i; }
                    });
                    if (ri >= 0) { tx = res[ri].x; ty = res[ri].y; go = 1; }
                }
            }
            b.mv = 0;
            if (!go) return;
            const dd = Math.hypot(tx - b.x, ty - b.y);
            if (dd <= 16) {
                if (!tm && b.dCd <= 0) { act(b); b.dCd = .8; }
                return;
            }
            let wx = tx, wy = ty;
            if (!clearLine(b.x, b.y, tx, ty)) {
                if (b.wp && Math.hypot(b.wp[0] - b.x, b.wp[1] - b.y) < 4) b.ptT = 0;
                if (b.ptT <= 0 || !b.wp) {
                    b.ptT = .4;
                    const st2 = pathStep(b.x / T | 0, (b.y - 1) / T | 0, tx / T | 0, ty / T | 0);
                    if (st2) b.wp = [st2[0] * T + T / 2, st2[1] * T + T / 2 + 4];
                    else { b.wp = null; if (ri >= 0) b.ban[ri] = gt + 25; }
                }
                if (b.wp) { wx = b.wp[0]; wy = b.wp[1]; }
            } else b.wp = null;
            let a = Math.atan2(wy - b.y, wx - b.x);
            if (b.jit > 0) a += b.jaw;
            if (!tm) b.face = a;
            mv(b, Math.cos(a) * 48 * dt, Math.sin(a) * 48 * dt);
            b.mv = 1;
            if (b.stk > .7) {
                if (b.lx !== undefined && Math.hypot(b.x - b.lx, b.y - b.ly) < 4) {
                    b.jit = .8;
                    b.jaw = (Math.random() < .5 ? -1 : 1) * (1.2 + Math.random());
                    b.ptT = 0;
                }
                b.lx = b.x;
                b.ly = b.y;
                b.stk = 0;
            }
        }

        function newGame(n) {
            gen();
            mobs = [];
            pl = [];
            wood = 3;
            scrap = 0;
            needB = levelNeed();
            radio = 0;
            fire = 60;
            tl = 300;
            spT = 6;
            panel = 0;
            flash = true;
            specIdx = 0;
            specSaid = false;
            runRight = 0;
            runGather = 0;
            diedAt = -1;
            // each bot is a different character (never the same as yours or each other)
            const pick = [];
            for (let c = 0; c < NAMES.length; c++) if (c != ch) pick.push(c);
            for (let i = pick.length - 1; i > 0; i--) {
                const j = Math.random() * (i + 1) | 0;
                const tmp = pick[i];
                pick[i] = pick[j];
                pick[j] = tmp;
            }
            let bi = 0;
            for (let i = 0; i < n; i++) {
                const isBot = mode == 1 && i > 0;
                const bc = isBot ? pick[bi++ % pick.length] : 0;
                const p = mk(i, isBot ? bc : (i == myId ? ch : i % NAMES.length));
                p.bot = isBot;
                p.name = isBot ? NAMES[bc] : '';
                pl.push(p);
            }
            me = pl[myId] || pl[0];
            me.name = shownName();
            try {
                navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {});
            } catch (e) {}
            st = 'game';
            stT = 0;
            shel = [];
            say('Survive until sunrise, or repair the radio!');
        }

        const say = s => {
            toast = s;
            toastT = 3;
        };
        function save() {
            if (!me || mode == 2) return;
            try {
                localStorage.setItem('lastcamp', JSON.stringify({
                    mode,
                    ch,

                    radio,

                    tl,
                    x: me.x,

                    hp: me.hp,

                }));

        function load() {
            try {
                const s = JSON.parse(localStorage.getItem('lastcamp'));
                mode = s.mode;
                ch = s.ch;
                myId = 0;
                newGame(mode == 1 ? 4 : 1);
                wood = s.wood;
                scrap = s.scrap;

                tl = s.tl;
                me.x = s.x;
                me.y = s.y;
                me.hp = s.hp;
                if (s.bc) pl.filter(q => q.bot).forEach((q, k) => {
                    if (s.bc[k] >= 0 && s.bc[k] < NAMES.length) {
                        q.ch = s.bc[k];
                        q.name = NAMES[q.ch];
                    }
                });
                shel = s.shel || [];
            } catch (e) {

        }

        const hasSave = () => {
            try {
                return!!localStorage.getItem('lastcamp');
            } catch (e) {
                return false;
            }
        };
        function end(w) {
            if (st == 'game') recordRun(w);
            else runInfo = null;
            win = w;
            st = 'end';
            stT = 0;
            panel = 0;
            died = !w && mode < 2 && !!me && me.hp <= 0;
            endTitle = w ? (radio >= 100 ? 'RESCUED!' : (mode == 2 && me && me.hp <= 0 ? 'THEY SURVIVED!' : 'YOU SURVIVED!')) : died ? 'OOPS! YOU DIED' : 'GAME OVER';
            if (died) {
                try {
                    navigator.vibrate && navigator.vibrate([120, 60, 240]);
                } catch (e) {}
            }
            if (mode == 2 && hostF) send('E ' + (w ? 1 : 0));
            msg = !w ? (died ? 'The forest has taken you.' : (mode == 2 ? 'Everyone has fallen. The forest wins.' : 'The camp has fallen to the night.')) : radio >= 100 ? 'The radio crackles. A rescue team is on the way.' : 'Sunrise breaks. You survived the night.';
            try {
                localStorage.removeItem('lastcamp');
            } catch (e) {}
            snd(w ? 880 : 150, .6, 'square', .2, w ? 1200 : 80);
        }

        const ang = (a, b) => {
            let x = a - b;
            while (x > Math.PI) x -= 6.283;
            while (x < -Math.PI) x += 6.283;
            return x;
        };
        function slash(p) {
            if (p.hp <= 0 || (quest && p == me)) return;
            if (p.atkCd > 0) return;
            p.atkCd = .4;
            p.atkT = .15;
            if (p == me) snd(900, .1, 'sawtooth', .08, 200);
            for (const m of [...mobs]) {
                const dx = m.x - p.x;
                const dy = m.y - p.y - 6;
                if (Math.hypot(dx, dy) < 30 && Math.abs(ang(Math.atan2(dy, dx), p.face)) < 1.2) {
                    if (rem(p)) {
                        send('H ' + m.id + ' 2');
                        continue;
                    }
                    m.hp -= 2;
                    const a = Math.atan2(m.y - p.y, m.x - p.x);
                    m.x += Math.cos(a) * 10;
                    m.y += Math.sin(a) * 10;
                    snd(190, .1, 'square', .15, 70);
                    if (m.hp <= 0) mobs.splice(mobs.indexOf(m), 1);
                }
            }
        }

        const dash = p => {
            if (p.hp <= 0 || (quest && p == me)) return;
            if (p.dCd > 0) return;
            p.dT = .18;
            p.dCd = 2.5;
            p.hurt = Math.max(p.hurt, .25);

        function act(p) {

            if (r) {

        function tick(dt) {

            let iy = 0;
            if (keys.a || keys.arrowleft) ix--;

            if (keys.w || keys.arrowup) iy--;
            if (keys.s || keys.arrowdown) iy++;
            if (joy) {
                const dx = joy.x - joy.ax;
                const dy = joy.y - joy.ay;
                const dd = Math.hypot(dx, dy);
                if (dd > 3) {
                    const m = Math.min(dd, 20) / 20;
                    ix += dx / dd * m;
                    iy += dy / dd * m;
                }
            }
            if (mode == 2 && me.hp <= 0) {
                ix = 0;
                iy = 0;
                me.dT = 0;
            }
            const l = Math.hypot(ix, iy);
            if (l > 1) {
                ix /= l;
                iy /= l;
            }
            for (const p of pl) {
                p.atkT -= dt;
                p.atkCd -= dt;
                p.dT -= dt;
                p.dCd -= dt;
                p.hurt -= dt;

            if (me.dT > 0) {

                me.mv = 1;
            } else if (me.mv) {
                me.face = Math.atan2(iy, ix);
                mv(me, ix * 62 * dt, iy * 62 * dt);
            }
            stepT -= dt;
            if (me.mv && me.dT <= 0 && stepT <= 0) {
                stepT = .3;

            if (!quest && !panel && me.hp > 0) {

                        break;
                    }
                }
            }
            if (me.curse > 0 && me.hp > 0) {
                const cd = Math.min(me.curse, dt);
                me.curse -= cd;
                me.hp -= .4 * cd;
            }
            mobSndT -= dt;
            if (mobSndT <= 0) {

                let bd = 190;
                for (const m of mobs) {

            } else mobs.forEach(m => m.ph += dt);

                    for (const m of mobs) if (Math.hypot(m.x - q.x, m.y - q.y) < 36) n++;
                    q.dur -= .4 * n * dt;
                    if (q.dur <= 0) {
                        shel.splice(i, 1);

                }
                pl.forEach(p => {

                    p.y = +a[3];

                    p.ch = +a[5];

                    p.mv = a[7] == '1' ? 1 : 0;
                    if (a[8] !== undefined) p.name = decName(a[8]);

        function closeNet() {

        function wrapTxt(s, x, y, sz, col, n) {

        // Put your online relay here once, e.g. 'wss://lastcamp.onrender.com'. Then players only type the room code.
        const RELAY_URL = '';

        function relayList() {
            const sec = location.protocol == 'https:', pre = sec ? 'wss://' : 'ws://', out = [];
            const typed = srvVal.trim().replace(/^(wss?|https?):\/\//, '').replace(/\/.*$/, '');
            if (typed) out.push(pre + (typed.includes(':') ? typed : typed + ':5050'));
            if (RELAY_URL) out.push(RELAY_URL);
            if (location.protocol.startsWith('http')) {
                out.push(pre + location.host);
                if (!sec && location.port != '5050') out.push('ws://' + location.hostname + ':5050');
            } else if (!typed) out.push('ws://localhost:5050');
            out.push('ws://localhost:5050');
            return out.filter((v, i) => out.indexOf(v) == i);

        function joinGame() {

        const ERRS = { 'no such room': 'No room has that code. Check it with the host.', 'room is full': 'That room is full.', 'host left': 'The host left the camp.' };

        function connect(first) {

                if (tk != netTry) return;

                    netMsg = 'Cannot reach the server. Start TheLastCampServer on this PC first (it uses localhost:5050).';
                    srvAsk = true;
                    ws = null;
                    return;
                }
                let w, opened = false;
                try { w = new WebSocket(list[i]); } catch (e) { attempt(i + 1); return; }
                ws = w;
                const to = setTimeout(() => { if (!opened) try { w.close(); } catch (e) {} }, 3500);
                w.onopen = () => {
                    opened = true;
                    clearTimeout(to);
                    if (srvVal.trim()) try { localStorage.setItem('lcserver2', srvVal.trim()); } catch (e) {}
                    netMsg = 'Connected...';
                    w.send(first);
                };
                w.onerror = () => {};
                w.onclose = () => {
                    clearTimeout(to);
                    if (tk != netTry || ws != w) return;
                    if (!opened) attempt(i + 1);
                    else if (st == 'lobby' || st == 'game') netMsg = 'Disconnected from relay';
                };

                    try {

                            const er = l.slice(4) || 'error';
                            netMsg = ERRS[er] || er;
                            if (st == 'game') { end(false); msg = netMsg; } else st = 'mp';
                            return;
                        }
                        if (!hostF) {
                            if (st == 'mp') { st = 'lobby'; netMsg = ''; }

                        const sp = l.indexOf(' '), id = +l.slice(0, sp), rest = l.slice(sp + 1);

                        } else if (rest == 'LEFT') {

                            lobbyIds.delete(id);

                                pl[id].hp = 0;

            };

        }

            if (st == 'char') {
                if (k == 'arrowleft' || k == 'a') ch = Math.max(0, ch - 1);
                if (k == 'arrowright' || k == 'd') ch = Math.min(NAMES.length - 1, ch + 1);
            }
            if (st == 'beast') {
                if (k == 'enter' || k == ' ' || k == 'arrowright') beastNext();
                if (k == 'arrowleft' && beastPg > 0) beastPg--;
                if (k == 'escape') beastGo();
            }
            if (st == 'instr' && (k == 'escape' || k == 'enter')) st = instrReturn;
            if (st == 'lore' && (k == ' ' || k == 'enter')) {
                st = 'mode';
                stT = 0;
            }
            if (st == 'game') {
                if (k == ' ' || k == 'j') slash(me);
                if (k == 'e' || k == 'enter') act(me);
                if (k == 'shift' || k == 'k') dash(me);
                if (k == 'f') flash = !flash;
                if (k == 'b') build(me);
                if (k == 'i' && !quest) panel = panel == 1 ? 0 : 1;
                if (k == 'm' && !quest) panel = panel == 3 ? 0 : 3;
                if (k == 'escape' && !quest) panel = panel ? 0 : 2;
            }
            if ([' ', 'arrowup', 'arrowdown'].includes(k)) e.preventDefault();
        });
        addEventListener('visibilitychange', () => { if (document.hidden && st == 'game') save(); });
        addEventListener('pagehide', () => { if (st == 'game') save(); });
        addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = 0;
        });
    </script>
</body>
</html>
